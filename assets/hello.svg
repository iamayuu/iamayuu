<svg width="500" height="160" viewBox="0 0 500 160"
     xmlns="http://www.w3.org/2000/svg">

  <rect width="100%" height="100%" fill="black"/>

  <g transform="translate(250 80)">
    <g>
      <animateTransform
        attributeName="transform"
        type="translate"
        from="0 0"
        to="0 -300"
        dur="12s"
        repeatCount="indefinite" />

      <text y="0"
            fill="white"
            font-size="44"
            font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
            font-weight="600"
            text-anchor="middle"
            dominant-baseline="middle">
        Hello
      </text>

      <text y="60" fill="white" font-size="44"
            font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
            font-weight="600"
            text-anchor="middle"
            dominant-baseline="middle">
        Namaste
      </text>

      <text y="120" fill="white" font-size="44"
            font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
            font-weight="600"
            text-anchor="middle"
            dominant-baseline="middle">
        Hola
      </text>

      <text y="180" fill="white" font-size="44"
            font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
            font-weight="600"
            text-anchor="middle"
            dominant-baseline="middle">
        Ciao
      </text>

      <text y="240" fill="white" font-size="44"
            font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
            font-weight="600"
            text-anchor="middle"
            dominant-baseline="middle">
        こんにちは
      </text>

      <text y="300" fill="white" font-size="44"
            font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
            font-weight="600"
            text-anchor="middle"
            dominant-baseline="middle">
        안녕하세요
      </text>
    </g>
  </g>

  <clipPath id="clip">
    <rect x="0" y="0" width="500" height="160"/>
  </clipPath>
</svg>
