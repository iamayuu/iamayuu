<svg width="500" height="200" viewBox="0 0 500 200" xmlns="http://www.w3.org/2000/svg">

  <style>

    text {

      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;

      font-size: 48px;

      font-weight: 600;

      fill: white;

      dominant-baseline: middle;

      text-anchor: middle;

    }



    .container {

      animation: slide 12s infinite;

    }



    @keyframes slide {

      0%   { transform: translateY(0); }

      14%  { transform: translateY(0); }



      16%  { transform: translateY(-60px); }

      30%  { transform: translateY(-60px); }



      32%  { transform: translateY(-120px); }

      46%  { transform: translateY(-120px); }



      48%  { transform: translateY(-180px); }

      62%  { transform: translateY(-180px); }



      64%  { transform: translateY(-240px); }

      78%  { transform: translateY(-240px); }



      80%  { transform: translateY(-300px); }

      100% { transform: translateY(-300px); }

    }

  </style>



  <rect width="100%" height="100%" fill="black"/>



  <g class="container" transform="translate(250 100)">

    <text y="0">Hello</text>

    <text y="60">Namaste</text>

    <text y="120">Hola</text>

    <text y="180">Ciao</text>

    <text y="240">こんにちは</text>

    <text y="300">안녕하세요</text>

  </g>

</svg>
